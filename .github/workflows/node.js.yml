name: Portifolio
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker:
    name: build da imagem e push para o docker hub
    runs-on: ubuntu-latest
    steps:
      - name: configurando QEMU
        uses: actions/checkout@v3

      - name: setando Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: logando no docker hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: extract metadata
        if: ${{ github.event_name == 'push' }}
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/portifolio

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}/portifolio:latest', secrets.DOCKER_USERNAME) || format('{0}/portifolio:pr', github.repository_owner) }}
